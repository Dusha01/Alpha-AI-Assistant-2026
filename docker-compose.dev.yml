name: alfa-course-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./src/data/backups/alfa_course_hackathon.backup:/backup/alfa_course_hackathon.backup:ro
      - ./scripts/postgres/init-restore.sh:/docker-entrypoint-initdb.d/01-restore.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          test "$$(psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname = 'public'")" -gt 0
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata_dev:
