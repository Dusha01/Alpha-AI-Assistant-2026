name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://alfa:ci_only@localhost:5432/alfa_course
      DATABASE_URL_TEST: postgresql+asyncpg://alfa:ci_only@localhost:5432/alfa_course
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: alfa
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: alfa_course
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alfa -d alfa_course"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Unit tests
        run: pytest -q -m "not integration"
      - name: Integration tests
        run: pytest -q -m integration
