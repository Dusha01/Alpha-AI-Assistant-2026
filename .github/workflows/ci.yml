name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://alfa:ci_only@localhost:5432/alfa_course
      DATABASE_URL_TEST: postgresql+asyncpg://alfa:ci_only@localhost:5432/alfa_course
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: alfa
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: alfa_course
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alfa -d alfa_course"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Wait for Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U alfa -d alfa_course; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1
      - name: Unit tests
        run: |
          pytest -q -m "not integration" --strict-markers \
            --cov=src --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=60
      - name: Integration tests
        run: pytest -q -m integration --strict-markers
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image
        run: docker build -f Docker/Dockerfile.dev .
