name: alfa-course-prod

x-app-env: &app-env
  APP_ENV: prod
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_URL_HOST: ""

services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./src/data/backups/alfa_course_hackathon.backup:/backup/alfa_course_hackathon.backup:ro
      - ./scripts/postgres/init-restore.sh:/docker-entrypoint-initdb.d/01-restore.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          test "$$(psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname = 'public'")" -gt 0
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Docker/Dockerfile.prod
    image: alfa-course-prod-app:latest
    env_file:
      - .env.prod
    environment:
      <<: *app-env
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,urllib.request;
          urllib.request.urlopen(
          f'http://127.0.0.1:{os.getenv(\"API_PORT\", \"8000\")}/health', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    image: alfa-course-prod-app:latest
    build:
      context: .
      dockerfile: Docker/Dockerfile.prod
    env_file:
      - .env.prod
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "src.data.migrate"]
    restart: "no"

  ingest:
    profiles: ["tools"]
    image: alfa-course-prod-app:latest
    build:
      context: .
      dockerfile: Docker/Dockerfile.prod
    env_file:
      - .env.prod
    environment:
      <<: *app-env
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface
    volumes:
      - hf_cache_prod:/cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "src.modules.knowledge.ingest"]
    restart: "no"

volumes:
  pgdata_prod:
  hf_cache_prod:
